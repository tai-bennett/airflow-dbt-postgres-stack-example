services:
  postgres:
    image: postgres:16-alpine  # Use a specific version for stability
    container_name: postgres-db
    environment:
      POSTGRES_PASSWORD: "postgres"  # Password for the default 'postgres' user
    volumes:
      - ../postgres/init-scripts/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql  # Mount init script
      - postgres-data:/var/lib/postgresql/data  # Persist data in a named volume
    ports:
      - "5432:5432"  # Map host port 5432 to container port 5432
    restart: unless-stopped
 
volumes:
  postgres-data:  # Named volume to persist Postgres data-
